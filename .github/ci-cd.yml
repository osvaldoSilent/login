name: CI/CD Pipeline - Quality Gate & Cloud Run

on:
  push:
    branches: [ "main" ]

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requerido por SonarQube para blame information

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests, Cucumber & SonarQube Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw clean verify sonar:sonar \
            -Dsonar.projectKey=tu-org_login-service \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.qualitygate.wait=true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Build and Push Container with Jib
        run: |
          ./mvnw compile com.google.cloud.tools:jib-maven-plugin:3.4.0:build \
            -Djib.to.image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/microservices/login-service:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: login-service
          region: us-central1
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/microservices/login-service:${{ github.sha }}
          flags: '--allow-unauthenticated --min-instances=0 --max-instances=2 --cpu-boost'