name: CI/CD Pipeline - Quality Gate & Cloud Run

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Required permissions for Google Cloud Workload Identity Federation (OIDC)
permissions:
  id-token: write # Allows GitHub Actions to request an OIDC token from GCP
  contents: read  # Allows checking out the repository source code

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
        # Github actions secrets are used to store sensitive information such as API keys, tokens, and passwords. In this case, the secrets are used to store the SonarQube token, project key, and organization key, which are required for running the SonarQube analysis.
      - name: Run Unit Tests, Coverage & SonarQube Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io" 
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION_KEY: ${{ secrets.SONAR_ORGANIZATION_KEY }}
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }} 
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PUBSUB_USER_CREATED_TOPIC: ${{ secrets.PUBSUB_USER_CREATED_TOPIC }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MS: ${{ secrets.JWT_EXPIRATION_MS }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.organization=$SONAR_ORGANIZATION_KEY \
            -Dsonar.projectKey=$SONAR_PROJECT_KEY \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Build and Push Container with Jib
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          mvn compile com.google.cloud.tools:jib-maven-plugin:3.4.5:build \
            -Djib.from.image=eclipse-temurin:25-jre-alpine \
            -Djib.to.image="us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/microservices/login-service:${GITHUB_SHA}" \
            -Djib.container.jvmFlags="-XX:+UseCompactObjectHeaders,-XX:+UseSerialGC,-XX:MaxRAMPercentage=75.0,-XX:TieredStopAtLevel=1,-Djava.security.egd=file:/dev/./urandom"
        #using GCP secret manager to inject secrets into the container at runtime, instead of building them into the image
      - name: Deploy to Cloud Run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: login-service
          region: us-central1
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/microservices/login-service:${{ github.sha }}
          env_vars: |
            SPRING_PROFILES_ACTIVE=dev
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            PUBSUB_USER_CREATED_TOPIC=${{ secrets.PUBSUB_USER_CREATED_TOPIC }}
            JWT_EXPIRATION_MS=${{ secrets.JWT_EXPIRATION_MS }}
          secrets: |
            DB_PASSWORD=db-password:latest
            JWT_SECRET=jwt-secret:latest
          flags: '--service-account=cloud-run-sa@project-d168a88d-1130-49df-8d8.iam.gserviceaccount.com --allow-unauthenticated --min-instances=0 --max-instances=2 --memory=512Mi --cpu=1 --cpu-boost'