services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: login-service-postgres
    environment:
      POSTGRES_DB: login_db
      POSTGRES_USER: login_user
      POSTGRES_PASSWORD: login_secret_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U login_user -d login_db']
      interval: 10s
      timeout: 5s
      retries: 5

  pubsub-emulator:
    image: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators'
    container_name: login-service-pubsub-emulator
    command: gcloud beta emulators pubsub start --project=osvaldevops-local --host-port=0.0.0.0:8085
    ports:
      - '8085:8085'

  sonarqube:
    image: 'sonarqube:community'
    container_name: login-service-sonarqube
    ports:
      - '9000:9000'
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
