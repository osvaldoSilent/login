spring:
  application:
    name: auth-service
  docker:
    compose:
      enabled: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 0
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 45000
      connection-timeout: 30000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID}

app:
  pubsub:
    topics:
      user-created: ${PUBSUB_USER_CREATED_TOPIC}

server:
  port: ${PORT:8081}

security:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.osvaldevops.login: DEBUG
    org.springframework.security: INFO
